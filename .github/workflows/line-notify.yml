name: Notify LINE

on:
  push:
    branches:
      - main
    paths:
      - "articles/**.md"
  workflow_dispatch:

jobs:
  send-line:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get article content
        id: article
        run: |
          FILE=$(git diff-tree --no-commit-id -r --diff-filter=A --name-only ${{ github.sha }} | grep 'articles/.*\.md$' | head -1)
          if [ -z "$FILE" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILE=$(ls articles/*.md 2>/dev/null | grep -v '.gitkeep' | sort | tail -1)
          fi
          if [ -z "$FILE" ]; then echo "No article found, skipping."; exit 0; fi
          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Send to LINE
        if: steps.article.outputs.file != ''
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          FILE: ${{ steps.article.outputs.file }}
        run: |
          python3 - <<'PYEOF'
          import re, os, subprocess, json

          file = os.environ['FILE']
          token = os.environ['LINE_TOKEN']
          to = os.environ['LINE_TO']

          with open(file) as f:
              content = f.read()

          date_match = re.search(r'^date:\s*(\d{4}-\d{2}-\d{2})', content, re.MULTILINE)
          if date_match:
              y, m, d = date_match.group(1).split('-')
              date_fmt = f"{d}/{m}/{y}"
          else:
              date_fmt = ""

          body = re.sub(r'^---[\s\S]*?---\s*', '', content)
          body = re.sub(r'^date:.*$', '', body, flags=re.MULTILINE)

          def render(body_text):
              c = re.sub(r'^#{1,6}\s*', '', body_text, flags=re.MULTILINE)
              c = re.sub(r'\*\*([^*]+)\*\*', r'\1', c)
              c = re.sub(r'\[([^\]]+)\]\(https?://[^\)]*\)', r'\1', c)
              c = re.sub(r'\n---\n', '\n\n──────────────\n\n', c)
              c = re.sub(r'_([^_]+)_', r'\1', c)
              c = re.sub(r'\n{3,}', '\n\n', c)
              c = c.strip()
              return f"🗞 สรุปข่าว AI ประจำวัน {date_fmt}\n\n{c}"

          LIMIT = 4500
          message = render(body)
          print(f"Message length: {len(message)} chars (limit {LIMIT})")

          if len(message) > LIMIT:
              # Deterministic fallback: the skill's own pre-commit char count is
              # LLM self-reported and has slipped before. Drop whole trailing news
              # items (never mid-sentence) until it fits, footer always kept.
              items = re.split(r'\n+---\n+', body.strip())
              footer = items.pop() if items and items[-1].lstrip().startswith('_') else None
              while len(items) > 1 and len(message) > LIMIT:
                  dropped = items.pop()
                  title = re.search(r'##\s*\d+\.\s*(.+)', dropped)
                  print(f"Auto-trim: dropped item -> {title.group(1) if title else '(untitled)'}")
                  rebuilt = '\n\n---\n\n'.join(items + ([footer] if footer else []))
                  message = render(rebuilt)
              print(f"Message length after auto-trim: {len(message)} chars (limit {LIMIT})")
              if len(message) > LIMIT:
                  raise SystemExit(
                      f"Message length {len(message)} exceeds {LIMIT} chars even after dropping "
                      f"all but one item — that single item is too long by itself. "
                      f"Fix at the source (skill step 5), not here."
                  )

          payload = {
              "to": to,
              "messages": [{"type": "text", "text": message}]
          }

          r = subprocess.run([
              'curl', '-s', '-X', 'POST',
              'https://api.line.me/v2/bot/message/push',
              '-H', f'Authorization: Bearer {token}',
              '-H', 'Content-Type: application/json',
              '-d', json.dumps(payload)
          ], capture_output=True, text=True)

          print(f"Response: {r.stdout}")

          try:
              body = json.loads(r.stdout)
          except json.JSONDecodeError:
              body = {}

          if r.returncode != 0 or 'message' in body:
              raise SystemExit(f"LINE push failed: {r.stdout}")
          PYEOF
