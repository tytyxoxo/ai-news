name: Notify LINE

on:
  push:
    branches:
      - main
    paths:
      - "articles/**.md"
  workflow_dispatch:

jobs:
  send-line:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get article content
        id: article
        run: |
          FILE=$(git diff-tree --no-commit-id -r --diff-filter=A --name-only ${{ github.sha }} | grep 'articles/.*\.md$' | head -1)
          if [ -z "$FILE" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILE=$(ls articles/*.md 2>/dev/null | grep -v '.gitkeep' | sort | tail -1)
          fi
          if [ -z "$FILE" ]; then echo "No article found, skipping."; exit 0; fi
          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Send to LINE
        if: steps.article.outputs.file != ''
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: python3 scripts/line_notify.py "${{ steps.article.outputs.file }}"
