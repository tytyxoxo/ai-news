name: Fetch feeds

# Runs before the 09:00 Asia/Bangkok routine: the routine's cloud session can't
# reach news sites, so it reads feeds/candidates.json (branch `feeds`) through the GitHub connector.
on:
  schedule:
    # ponytail: hourly because GitHub cron is best-effort — on day one the 07:17 run never
    # fired and the watchdog ran 7h45m late. Each run overwrites one orphan commit, so no history cost.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Self-test
        run: |
          python3 scripts/test_fetch_feeds.py
          python3 scripts/test_line_notify.py

      - name: Fetch feeds
        run: python3 scripts/fetch_feeds.py

      - name: Publish candidates to branch feeds
        # Single orphan commit, force-pushed daily: ~140KB/day never piles up in history.
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd "$(mktemp -d)"
          git init -q -b feeds
          mkdir feeds && cp "$GITHUB_WORKSPACE/feeds/candidates.json" feeds/
          git add feeds && git commit -qm "Feed candidates $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" feeds

      - name: Prune articles older than 30 days
        run: |
          CUTOFF=$(TZ=Asia/Bangkok date -d '30 days ago' +%F)
          for f in articles/????-??-??-brief.md; do
            [ -e "$f" ] || continue
            d=$(basename "$f" | cut -c1-10)
            if [[ "$d" < "$CUTOFF" ]]; then git rm -q "$f"; fi
          done
          if git diff --cached --quiet; then echo "Nothing to prune"; exit 0; fi
          git commit -m "Prune articles older than $CUTOFF [skip ci]"
          git pull --rebase -q && git push  # routine may have committed since checkout
